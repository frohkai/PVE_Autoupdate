name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC2034,SC1090,SC2016,SC2155 pve-autoupdate.sh
      - name: tests (Alpine, mocked Proxmox)
        run: docker run --rm -v "$PWD:/src:ro" alpine sh -c "apk add -q bash python3 && bash /src/tests/run-tests.sh"
      - name: tests (PowerShell part for Windows VMs)
        shell: bash
        run: bash tests/run-ps-tests.sh
